<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    /*LEAFLET_CSS*/
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a1323;
      touch-action: none !important;
      -ms-touch-action: none !important;
      user-select: none;
      -webkit-user-select: none;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: #0a1323;
      touch-action: none !important;
      -ms-touch-action: none !important;
    }
    .leaflet-container {
      touch-action: none !important;
      -ms-touch-action: none !important;
    }
    /* Clean Dark Mode style without heavy multi-stage GPU filters that crash software Mesa */
    .dark-tiles {
      opacity: 0.9;
    }
    /* Zoom controls offset from corners to avoid clipping */
    .leaflet-top.leaflet-left {
      margin-top: 10px;
      margin-left: 10px;
    }
    .leaflet-bar {
      border-radius: 8px !important;
      overflow: hidden;
      border: none !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25) !important;
    }
    .leaflet-bar a {
      width: 32px !important;
      height: 32px !important;
      line-height: 32px !important;
      font-size: 16px !important;
    }
    /* Port of createMarkerIcon's inline styles from web src/components/common/MapViewer.tsx */
    .hi-marker {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; box-sizing: border-box;
    }
    .hi-marker .material-icons-fallback { color: #fff; font-size: 16px; font-weight: bold; }
    /* Rich popup content, port of web src/components/common/MapViewer.tsx's <Popup> */
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .hi-popup { min-width: 220px; max-width: 260px; font-family: sans-serif; }
    .hi-popup img { width: 100%; height: 96px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; display: block; }
    .hi-popup .hi-popup-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; margin-bottom: 4px; }
    .hi-popup h4 { margin: 0; font-size: 14px; font-weight: 700; color: #1e293b; }
    .hi-popup .hi-badge { font-size: 9px; font-weight: 600; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .hi-popup .hi-badge-gem { background: rgba(32,255,140,0.15); color: #059669; }
    .hi-popup .hi-badge-cat { background: rgba(0,0,0,0.08); color: #554336; }
    .hi-popup p.hi-desc { font-size: 12px; line-height: 1.4; margin: 0 0 8px; color: #554336; }
    .hi-popup .hi-tip { font-size: 10px; font-weight: 500; color: #8f4e00; background: rgba(255,153,51,0.1); padding: 6px; border-radius: 8px; margin-bottom: 8px; }
    .hi-popup .hi-footer { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: rgba(85,67,54,0.7); border-top: 1px solid rgba(219,194,176,0.3); padding-top: 6px; }
    .hi-popup .hi-cost { color: #31628d; font-weight: 600; }

    /* Dark Mode Popups */
    body.dark-theme .leaflet-popup-content-wrapper {
      background: #0f1c2e;
      color: #f1f5f9;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    body.dark-theme .leaflet-popup-tip {
      background: #0f1c2e;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    body.dark-theme .leaflet-popup-close-button {
      color: #94a3b8 !important;
    }
    body.dark-theme .hi-popup h4 {
      color: #f8fafc;
    }
    body.dark-theme .hi-popup p.hi-desc {
      color: #cbd5e1;
    }
    body.dark-theme .hi-popup .hi-badge-gem {
      background: rgba(32, 255, 140, 0.2);
      color: #20ff8c;
    }
    body.dark-theme .hi-popup .hi-badge-cat {
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }
    body.dark-theme .hi-popup .hi-tip {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    body.dark-theme .hi-popup .hi-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
    }
    body.dark-theme .hi-popup .hi-cost {
      color: #38bdf8;
    }
    body.dark-theme .leaflet-bar a {
      background-color: #0f1c2e;
      color: #f8fafc;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(0,0,0,0.6) !important;
      color: #ccc !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      pointer-events: none !important;
      user-select: none !important;
    }
    .leaflet-control-attribution * {
      pointer-events: none !important;
      text-decoration: none !important;
      color: #ccc !important;
      cursor: default !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    /*LEAFLET_JS*/
  </script>
  <script>
    var isDark = %%IS_DARK%%;
    if (isDark) {
      document.body.classList.add('dark-theme');
    } else {
      document.body.style.backgroundColor = '#f1f5f9';
      document.getElementById('map').style.backgroundColor = '#f1f5f9';
    }

    // Force Leaflet to use 2D DOM rendering to avoid GPU context crashes on Mesa software emulation
    if (L.Browser) {
      L.Browser.any3d = false;
      L.Browser.webkit3d = false;
      L.Browser.gecko3d = false;
      L.Browser.ie3d = false;
    }

    var map = L.map('map', {
      zoomControl: true,
      attributionControl: true,
      fadeAnimation: false,
      zoomAnimation: false,
      markerZoomAnimation: false,
      dragging: true,
      touchZoom: true,
      preferCanvas: false
    }).setView([20.5937, 78.9629], 5);

    // Ensure touch events inside map container do not trigger external page movement
    var mapContainer = document.getElementById('map');
    if (mapContainer) {
      mapContainer.addEventListener('touchmove', function(e) {
        if (e.cancelable) {
          e.preventDefault();
        }
      }, { passive: false });
    }

    // Remove the Leaflet hyperlink prefix so it never displays or navigates away
    if (map.attributionControl) {
      map.attributionControl.setPrefix(false);
    }

    window.map = map;

    // Always use official OpenStreetMap tiles, styled cleanly with dark mode filter when in dark theme
    var tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

    var tileLayer = L.tileLayer(tileUrl, {
      maxZoom: 19,
      maxNativeZoom: 14,
      subdomains: ['a', 'b', 'c'],
      className: isDark ? 'dark-tiles' : '',
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function setTheme(dark) {
      isDark = dark;
      if (isDark) {
        document.body.classList.add('dark-theme');
      } else {
        document.body.classList.remove('dark-theme');
      }
      document.body.style.backgroundColor = isDark ? '#0a1323' : '#f1f5f9';
      var mapEl = document.getElementById('map');
      if (mapEl) mapEl.style.backgroundColor = isDark ? '#0a1323' : '#f1f5f9';
      if (tileLayer && tileLayer.getContainer()) {
        if (isDark) {
          tileLayer.getContainer().classList.add('dark-tiles');
        } else {
          tileLayer.getContainer().classList.remove('dark-tiles');
        }
      }
    }
    window.setTheme = setTheme;

    function resizeMap() {
      if (window.map) {
        window.map.invalidateSize();
      }
    }
    window.addEventListener('resize', resizeMap);
    if (window.ResizeObserver) {
      new ResizeObserver(function() {
        resizeMap();
      }).observe(document.getElementById('map'));
    }
    setTimeout(resizeMap, 50);
    setTimeout(resizeMap, 150);
    setTimeout(resizeMap, 300);
    setTimeout(resizeMap, 600);
    setTimeout(resizeMap, 1200);

    var markerLayer = L.layerGroup().addTo(map);
    var userLayer = L.layerGroup().addTo(map);

    function colorFor(kind, isDark) {
      if (kind === 'gem') return isDark ? '#20ff8c' : '#059669';
      if (kind === 'food') return '#f59e0b';
      if (kind === 'experience') return '#a855f7';
      if (kind === 'center') return isDark ? '#20ff8c' : '#ff9933';
      return isDark ? '#20ff8c' : '#3b82f6';
    }

    function getIconSvg(kind, size) {
      var s = size || 16;
      if (kind === 'gem') {
        return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="currentColor"><path d="M12 2L3 9l9 13 9-13-9-7zm0 3.2L17.6 9H6.4L12 5.2zM5.5 10.5h4.1L12 18.2 5.5 10.5zm6.5 7.7V10.5h4.1L12 18.2z"/></svg>';
      }
      if (kind === 'food') {
        return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="currentColor"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>';
      }
      if (kind === 'experience') {
        return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm2.19-12.19L8.5 11.5l3.69 5.69 5.69-3.69-3.69-5.69zm-1.07 4.76c-.6 0-1.07-.48-1.07-1.07s.48-1.07 1.07-1.07 1.07.48 1.07 1.07-.48 1.07-1.07 1.07z"/></svg>';
      }
      if (kind === 'center') {
        return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>';
      }
      // default: monument / landmark
      return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="currentColor"><path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 2.84L18 11v7H6v-7l6-5.16zM10 13h4v5h-4v-5z"/></svg>';
    }

    function makeIcon(kind, size) {
      var bg = isDark ? '#0d192e' : '#ffffff';
      var color = colorFor(kind, isDark);
      var iconSize = Math.round(size * 0.52);
      var iconSvg = getIconSvg(kind, iconSize);
      var html = '<div class="hi-marker" style="width:' + size + 'px;height:' + size + 'px;' +
        'background:' + bg + ';border:2px solid ' + color + ';border-radius:50%;' +
        'display:flex;align-items:center;justify-content:center;color:' + color + ';' +
        'box-shadow:0 0 8px ' + color + '80, 0 3px 6px rgba(0,0,0,0.5);">' +
        iconSvg +
        '</div>';
      return L.divIcon({ html: html, className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Port of web MapViewer.tsx's <Popup> content — image, name, gem/category badge,
    // description, insider tip, and a best-time/cost footer.
    function buildPopupHtml(p) {
      var html = '<div class="hi-popup">';
      var img = p.image || '';
      if (img) {
        html += '<img src="' + escapeHtml(img) + '" alt="' + escapeHtml(p.name) + '" onerror="this.style.display=\'none\'" referrerpolicy="no-referrer" />';
      }
      html += '<div class="hi-popup-head"><h4>' + escapeHtml(p.name) + '</h4>';
      if (p.isCenter) {
        html += '<span class="hi-badge hi-badge-gem" style="background:rgba(255,153,51,0.2);color:#ea580c">Location Center</span>';
      } else if (p.kind === 'gem') {
        html += '<span class="hi-badge hi-badge-gem">Gem</span>';
      } else if (p.kind === 'food') {
        // Food badge omitted per user request
      } else if (p.kind === 'experience') {
        html += '<span class="hi-badge" style="background:rgba(168,85,247,0.2);color:#9333ea">' + escapeHtml(p.category || 'Experience') + '</span>';
      } else if (p.category) {
        html += '<span class="hi-badge hi-badge-cat">' + escapeHtml(p.category) + '</span>';
      }
      html += '</div>';
      if (p.description) {
        html += '<p class="hi-desc">' + escapeHtml(p.description) + '</p>';
      }
      if (p.insiderTip) {
        html += '<div class="hi-tip">\uD83D\uDCA1 ' + escapeHtml(p.insiderTip) + '</div>';
      }
      if (p.kind !== 'food' && (p.bestTimeOfDay || p.estimatedCost)) {
        html += '<div class="hi-footer"><span>' + escapeHtml(p.bestTimeOfDay || '') + '</span><span class="hi-cost">' + escapeHtml(p.estimatedCost || '') + '</span></div>';
      }
      html += '</div>';
      return html;
    }

    // Called from Kotlin: setMarkers([{id,lat,lng,name,kind,isCenter,image,description,
    // category,insiderTip,bestTimeOfDay,estimatedCost}])
    function setMarkers(data) {
      try {
        resizeMap();
        markerLayer.clearLayers();
        var items = (typeof data === 'string') ? JSON.parse(data) : data;
        if (!Array.isArray(items)) return;
        var bounds = [];
        items.forEach(function (p) {
          var size = p.isCenter ? 44 : (p.kind === 'gem' ? 38 : 30);
          var marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.isCenter ? 'center' : p.kind, size) });
          marker.bindPopup(buildPopupHtml(p), { maxWidth: 260 });
          marker.on('click', function () {
            if (window.Android && window.Android.onMarkerClick) {
              window.Android.onMarkerClick(p.id);
            }
          });
          marker.addTo(markerLayer);
          bounds.push([p.lat, p.lng]);
        });
        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
        }
      } catch (err) {
        console.error('setMarkers error:', err);
      }
    }

    function setUserLocation(lat, lng, accuracyLabel) {
      try {
        resizeMap();
        userLayer.clearLayers();
        var dot = L.circleMarker([lat, lng], {
          radius: 8, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.9, weight: 2
        }).bindPopup('You are here' + (accuracyLabel ? ' (' + accuracyLabel + ')' : ''));
        dot.addTo(userLayer);
        map.setView([lat, lng], 12);
      } catch (err) {
        console.error('setUserLocation error:', err);
      }
    }

    function focusOn(lat, lng, zoom) {
      try {
        resizeMap();
        map.setView([lat, lng], zoom || 14);
      } catch (err) {
        console.error('focusOn error:', err);
      }
    }
  </script>
</body>
</html>
